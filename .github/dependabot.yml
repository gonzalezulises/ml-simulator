version: 2

# Este repo no tenia .github/dependabot.yml, asi que solo recibia actualizaciones de
# seguridad: una por vulnerabilidad, sin agrupar y sin nada que las cerrara.
#
# `applies-to: security-updates` las colapsa en un PR por tanda. El `cooldown` no sirve
# aqui: por diseno de GitHub no aplica a las actualizaciones de seguridad.
#
# `open-pull-requests-limit: 0` en las dos entradas apaga las actualizaciones de *version*
# y deja pasar las de seguridad. Es deliberado: este repo no tiene un check requerido que
# construya el proyecto, asi que un bump no tendria quien lo verifique y la cola volveria a
# llenarse. Se encienden cuando el repo tenga su compuerta de CI.
updates:
  - package-ecosystem: npm
    # Siete días de madurez antes de proponer una versión.
    cooldown:
      default-days: 7
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: security-updates
        patterns:
          - "*"
